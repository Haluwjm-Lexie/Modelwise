name: Weekly Modelwise update

on:
  schedule:
    # Every Monday 08:00, Asia/Singapore (GitHub cron is UTC).
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Modelwise
        uses: actions/checkout@v4

      - name: Update verified model data
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/weekly-update.mjs

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json workbook-models.json pricing.json changelog.json update-status.json
          git diff --cached --quiet || git commit -m "chore: weekly verified model update"
          git push
